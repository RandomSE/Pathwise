[pytest]
testpaths = tests
timeout = 30
timeout_method = thread
markers =
    needs_map_bake: start_round should rasterize map tiles (real Arcade window)
    needs_gl2: real OpenGL 2.0 / Arcade window (skipped on Windows GitHub Actions)
filterwarnings =
    ignore:.*ctypes._pointer_type_cache.*:DeprecationWarning
