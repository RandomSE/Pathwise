name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Arcade system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglu1-mesa \
            libx11-6 \
            libxext6 \
            libxrandr2 \
            libxi6 \
            libxxf86vm1 \
            libxcursor1 \
            libxinerama1 \
            xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Regression suite and coverage gate (Linux)
        if: runner.os == 'Linux'
        run: >
          xvfb-run -a python -m pytest tests/
          --cov=pathwise --cov=map_generation --cov=analytics --cov=main
          --cov-report=term-missing --cov-config=.coveragerc

      - name: Regression suite (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest tests/ -q
